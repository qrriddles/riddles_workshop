function parseDelimited(input,delimiter){const rows=[],current=[];let val='',quoted=false,started=false;input=input.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');for(let i=0;i<input.length;i++){let c=input[i];if(quoted){if(c==='"'&&input[i+1]==='"'){val+='"';i++}else if(c==='"')quoted=false;else val+=c}else if(c==='"'&&!started&&!val){quoted=true;started=true}else if(c===delimiter){current.push(val);val='';started=false}else if(c==='\n'){current.push(val);rows.push(current.slice());current.length=0;val='';started=false}else{val+=c;started=true}}if(quoted)throw Error(TEXT.csvMalformed);if(val!==''||current.length){current.push(val);rows.push(current)}return rows}

function setStatus(id,message,error){const node=$(id);node.classList.remove('hidden');node.className='status '+(error?'error':'ok');node.textContent=message}
function downloadJSON(){try{const blob=new Blob([JSON.stringify({format:'lantern-workshop',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='灯谜工坊-备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}catch(e){setStatus('importStatus',text('exportError',{message:e.message}),true)}}
async function handleJSONFile(file){if(!file)return;if(file.size>10*1024*1024){setStatus('importStatus',TEXT.fileTooLarge,true);return}try{const raw=await file.text();const data=JSON.parse(raw);if(Array.isArray(data)){ $('paste').value=raw;$('importFormat').value='json';doPreview();setStatus('importStatus',TEXT.validationOK,false);return}if(!data||!Array.isArray(data.riddles)||!data.riddles.every(r=>validRiddle(cleanRiddle(r))))throw Error(TEXT.badJSON);if(data.format==='lantern-workshop'){if(!confirm(TEXT.restoreConfirm))return;state={riddles:data.riddles.map(cleanRiddle),results:safeResults(data.results),history:Array.isArray(data.history)?data.history:[],sessionStarted:typeof data.sessionStarted==='string'?data.sessionStarted:new Date().toISOString()};save();updateFilterChoices();rebuildOrder(false);renderSummary();setStatus('importStatus',TEXT.restoreSuccess,false)}else{$('paste').value=raw;$('importFormat').value='json';doPreview();setStatus('importStatus',TEXT.validationOK,false)}}catch(e){setStatus('importStatus',text('readError',{message:e.message}),true)}finally{$('jsonFile').value=''}}
let editingId=null,editorDirty=false,editorBaseline='';
const E_FIELDS=['number','question','scope','answer','difficulty','technique','hint','notes'];
function editorValue(){const v={};for(const k of E_FIELDS)v[k]=$('ed-'+k).value.trim();return v}
function editorString(){return JSON.stringify(editorValue())}
function editorPrompt(){return !editorDirty||editorString()===editorBaseline||confirm(TEXT.editorUnsaved)}
function chooseEditor(id,force=false){if(!force&&!editorPrompt())return;editingId=id;const r=state.riddles.find(x=>x.id===id)||{};for(const k of E_FIELDS)$('ed-'+k).value=r[k]||'';editorBaseline=editorString();editorDirty=false;$('editorStatus').classList.add('hidden');$('editorDelete').disabled=!id;renderEditorList()}
function renderEditorList(){const needle=$('editorSearch').value.trim().toLowerCase();const list=state.riddles.filter(r=>[r.number,r.question,r.scope,r.technique].some(v=>v.toLowerCase().includes(needle)));setText('editorCount',text('editorCount',{count:list.length}));$('editorList').replaceChildren();if(!list.length)$('editorList').append(el('p','muted',TEXT.editorEmpty));for(const [i,r] of list.entries()){const b=el('button',r.id===editingId?'active':'',`${r.number||i+1} · ${r.question}`);b.type='button';b.onclick=()=>chooseEditor(r.id);$('editorList').append(b)}}
function renderEditor(){const ds=$('ed-difficulty');const selected=ds.value;ds.replaceChildren(...[['',TEXT.editorNone],['初学',TEXT.initial],['普通',TEXT.normal],['公开',TEXT.public]].map(([v,l])=>new Option(l,v)));ds.value=selected;const dl=$('techniqueSuggestions');dl.replaceChildren(...[...new Set(state.riddles.map(r=>r.technique).filter(Boolean))].sort().map(v=>new Option(v)));if(editingId&&!state.riddles.some(r=>r.id===editingId))chooseEditor(null,true);renderEditorList()}
function saveEditor(e){e.preventDefault();const v=editorValue();if(!v.question||!v.scope||!v.answer){setStatus('editorStatus',TEXT.editorNeedFields,true);return}if(v.number&&state.riddles.some(r=>r.id!==editingId&&r.number===v.number)&&!confirm(TEXT.editorDuplicateNumber))return;const existed=!!editingId;const id=editingId||uid();if(existed){const ix=state.riddles.findIndex(r=>r.id===id);if(ix<0)return;state.riddles[ix]=cleanRiddle({...v,id})}else state.riddles.push(cleanRiddle({...v,id}));editingId=id;editorBaseline=editorString();editorDirty=false;save();updateFilterChoices();rebuildOrder(false);renderEditor();renderSummary();setStatus('editorStatus',existed?TEXT.editorSaved:TEXT.editorCreated,false)}
function deleteEditor(){if(!editingId)return;if(!confirm(TEXT.editorDeleteConfirm))return;state.riddles=state.riddles.filter(r=>r.id!==editingId);delete state.results[editingId];editingId=null;editorDirty=false;save();updateFilterChoices();rebuildOrder(false);chooseEditor(null,true);renderEditor();renderSummary();setStatus('editorStatus',TEXT.editorDeleted,false)}

let presenterWasFullscreen=false;
function enterPresenter(which){
  if(!['flash','board'].includes(which))return;
  if(tab!==which)showTab(which);
  document.body.classList.add('presenting');
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('present-active',v.id==='view-'+which));
  ['presentFlash','presentBoard'].forEach(id=>setText(id,TEXT.presentExit));
  // Fullscreen API is optional: iPad Safari and file previews may not support it.
  try{const root=document.documentElement;if(root.requestFullscreen){const attempt=root.requestFullscreen();presenterWasFullscreen=true;if(attempt&&attempt.catch)attempt.catch(()=>{presenterWasFullscreen=false})}}catch(e){presenterWasFullscreen=false}
  window.scrollTo(0,0);
}
function exitPresenter(){
  document.body.classList.remove('presenting');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('present-active'));
  ['presentFlash','presentBoard'].forEach(id=>setText(id,TEXT.presentEnter));
  if(presenterWasFullscreen&&document.fullscreenElement&&document.exitFullscreen){try{const attempt=document.exitFullscreen();if(attempt&&attempt.catch)attempt.catch(()=>{})}catch(e){}}
  presenterWasFullscreen=false;
}
function togglePresenter(which){document.body.classList.contains('presenting')?exitPresenter():enterPresenter(which)}
function bind(){document.querySelectorAll('[data-text]').forEach(n=>n.textContent=TEXT[n.dataset.text]??n.dataset.text);for(const [id,items] of [['deck',[['all',TEXT.allDeck],['retry',TEXT.retryDeck],['missed',TEXT.missedDeck]]],['importFormat',[['auto',TEXT.formatAuto],['tsv',TEXT.formatTSV],['csv',TEXT.formatCSV],['json','JSON']]],['importBehavior',[['replace',TEXT.replace],['append',TEXT.append]]]])$(id).replaceChildren(...items.map(([v,l])=>new Option(l,v)));$('showDiff').checked=true;$('presentFlash').onclick=()=>togglePresenter('flash');$('presentBoard').onclick=()=>togglePresenter('board');$('presentDetailExit').onclick=exitPresenter;document.addEventListener('fullscreenchange',()=>{if(document.body.classList.contains('presenting')&&!document.fullscreenElement&&presenterWasFullscreen){presenterWasFullscreen=false;exitPresenter()}});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{if(tab==='editor'&&b.dataset.tab!=='editor'&&!editorPrompt())return;showTab(b.dataset.tab)}));$('editorForm').addEventListener('submit',saveEditor);$('editorNew').onclick=()=>chooseEditor(null);$('editorCancel').onclick=()=>chooseEditor(editingId,true);$('editorDelete').onclick=deleteEditor;$('editorSearch').addEventListener('input',renderEditorList);for(const k of E_FIELDS)$('ed-'+k).addEventListener('input',()=>editorDirty=true);$('hostToggle').addEventListener('click',()=>{const c=$('hostControls');c.classList.toggle('hidden');setText('hostToggle',c.classList.contains('hidden')?TEXT.hostShow:TEXT.hostHide)});setText('hostToggle',TEXT.hostHide);['difficulty','technique','deck','shuffle','retryMissed'].forEach(id=>$(id).addEventListener('change',()=>rebuildOrder(false)));$('summaryIncludeMissed').addEventListener('change',renderSummary);$('showDiff').addEventListener('change',()=>{renderFlash();renderBoardDetail()});$('prev').onclick=()=>{if(cursor>0){cursor--;revealStep=0;renderFlash()}};$('next').onclick=advance;$('hideReveal').onclick=()=>{if(revealStep>0){revealStep--;renderFlash()}};$('reveal').onclick=()=>{const r=current();if(r){revealStep=Math.min(revealStep+1,stages(r).length);renderFlash()}};$('got').onclick=()=>{const r=current();if(r){mark(r.id,'solved');advance()}};$('missed').onclick=()=>{const r=current();if(r){mark(r.id,'missed');advance()}};$('skip').onclick=advance;$('boardClose').onclick=()=>{boardSelected=null;renderBoardDetail()};$('boardHideReveal').onclick=()=>{if(boardRevealStep>0){boardRevealStep--;renderBoardDetail()}};$('boardReveal').onclick=()=>{const r=state.riddles.find(r=>r.id===boardSelected);if(r){boardRevealStep=Math.min(boardRevealStep+1,stages(r).length);renderBoardDetail()}};$('boardGot').onclick=()=>{mark(boardSelected,'solved');boardSelected=null;renderBoardDetail()};$('boardMissed').onclick=()=>{mark(boardSelected,'missed');boardSelected=null;renderBoardDetail()};$('boardUnmark').onclick=()=>{mark(boardSelected,null);boardSelected=null;renderBoardDetail()};$('preview').onclick=doPreview;$('clearPaste').onclick=()=>{$('paste').value='';previewData=null;$('previewArea').classList.add('hidden')};$('confirmImport').onclick=commitImport;$('export').onclick=downloadJSON;$('jsonFile').addEventListener('change',e=>handleJSONFile(e.target.files[0]));$('reviewMissed').onclick=()=>{for(const id of ['difficulty','technique'])for(const option of $(id).options)option.selected=false;$('retryMissed').checked=$('summaryIncludeMissed').checked;$('deck').value='retry';rebuildOrder(false);showTab('flash')};$('resetSession').onclick=()=>{if(!confirm(TEXT.resetConfirm))return;if(Object.keys(state.results).length)state.history.push({started:state.sessionStarted,ended:new Date().toISOString(),results:{...state.results}});state.results={};state.sessionStarted=new Date().toISOString();$('deck').value='all';$('retryMissed').checked=false;for(const id of ['difficulty','technique'])for(const option of $(id).options)option.selected=false;save();rebuildOrder(false);renderSummary();showTab('flash')}}
loadLocal();bind();updateFilterChoices();rebuildOrder(false);renderSummary();chooseEditor(null,true);renderEditor();
